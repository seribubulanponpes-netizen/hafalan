<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hafalan Santri</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#07111f;
    color:white;
    min-height:100vh;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    padding:25px 10px;
}

.header h1{
    font-size:32px;
    margin-bottom:8px;
}

.header p{
    color:#94a3b8;
}

/* NAV */

.nav{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.nav button{
    flex:1;
}

/* CARD */

.card{
    background:#0f1c2e;
    border:1px solid #1e334d;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

/* SEARCH */

.search-box{
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:1px solid #29435e;
    background:#081423;
    color:white;
    outline:none;
    font-size:15px;
}

/* BUTTON */

.btn{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-weight:bold;
}

.btn-primary{
    background:#0ea5e9;
    color:white;
}

.btn-success{
    background:#22c55e;
    color:white;
}

.btn-danger{
    background:#ef4444;
    color:white;
}

.btn-warning{
    background:#f59e0b;
    color:white;
}

.btn-secondary{
    background:#334155;
    color:white;
}

/* STUDENT */

.student-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.student{
    background:#12243a;
    border:1px solid #203b57;
    padding:18px;
    border-radius:17px;
}

.student-name{
    font-size:18px;
    font-weight:bold;
}

.student-class{
    color:#94a3b8;
    margin-top:5px;
}

.progress{
    margin-top:15px;
    height:9px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#22c55e;
    transition:.3s;
}

.progress-text{
    color:#94a3b8;
    font-size:12px;
    margin-top:7px;
}

.student-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.student-actions button{
    flex:1;
}

/* PAGE */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CATEGORY */

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.category{
    border:1px solid #263f59;
    background:#12243a;
    padding:20px;
    border-radius:18px;
    text-align:left;
    color:white;
}

.category-icon{
    font-size:30px;
    margin-bottom:10px;
}

.category h3{
    margin-bottom:5px;
}

.category p{
    color:#94a3b8;
    font-size:13px;
}

/* MATERIAL */

.back{
    margin-bottom:15px;
}

.material-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.material-item{
    background:#12243a;
    border:1px solid #243b53;
    border-radius:15px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:14px;
}

.material-item.done{
    border-color:#22c55e;
    background:#102d24;
}

.material-item input{
    width:22px;
    height:22px;
    accent-color:#22c55e;
}

.material-name{
    flex:1;
}

.material-status{
    font-size:12px;
    color:#94a3b8;
}

.done .material-status{
    color:#4ade80;
}

/* STATISTICS */

.statistik-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat-box{
    background:#12243a;
    border:1px solid #243b53;
    border-radius:17px;
    padding:20px;
    text-align:center;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

.stat-label{
    color:#94a3b8;
    margin-top:5px;
}

/* RANKING */

.ranking{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}

.rank-item{
    background:#12243a;
    border:1px solid #243b53;
    border-radius:15px;
    padding:15px;
}

.rank-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
}

.rank-name{
    font-weight:bold;
}

.rank-value{
    color:#38bdf8;
    font-weight:bold;
}

.rank-bar{
    height:12px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.rank-fill{
    height:100%;
    background:#22c55e;
}

/* SELECT */

select{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#081423;
    border:1px solid #29435e;
    color:white;
    outline:none;
    margin-top:12px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:450px;
    background:#0f1c2e;
    border:1px solid #263f59;
    border-radius:20px;
    padding:22px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
}

.form-group input{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #29435e;
    background:#081423;
    color:white;
    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    background:#22c55e;
    color:white;
    padding:13px 20px;
    border-radius:12px;
    opacity:0;
    transition:.3s;
    z-index:9999;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.empty{
    text-align:center;
    padding:35px;
    color:#94a3b8;
}

@media(max-width:700px){

    .container{
        padding:12px;
    }

    .header h1{
        font-size:25px;
    }

    .student-list,
    .category-grid,
    .statistik-grid{
        grid-template-columns:1fr;
    }

    .nav{
        flex-direction:column;
    }

    .rank-top{
        gap:10px;
    }
}
</style>
</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
updateDoc,
deleteDoc,
doc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyCdOLEzXU0JqYL_3W6N1ClwlQCF4Njms2U",

authDomain:
"hafalan-8e6e4.firebaseapp.com",

projectId:
"hafalan-8e6e4",

storageBucket:
"hafalan-8e6e4.firebasestorage.app",

messagingSenderId:
"859030286938",

appId:
"1:859030286938:web:c42079d7780e253e589e63",

measurementId:
"G-QE2VL93VK3"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const siswaCollection =
collection(db,"siswa");



/* MATERI */

const materi = {

juz30:[

"An-Naba",
"An-Nazi'at",
"'Abasa",
"At-Takwir",
"Al-Infitar",
"Al-Mutaffifin",
"Al-Insyiqaq",
"Al-Buruj",
"At-Tariq",
"Al-A'la",
"Al-Ghasyiyah",
"Al-Fajr",
"Al-Balad",
"Asy-Syams",
"Al-Lail",
"Ad-Duha",
"Asy-Syarh",
"At-Tin",
"Al-'Alaq",
"Al-Qadr",
"Al-Bayyinah",
"Az-Zalzalah",
"Al-'Adiyat",
"Al-Qari'ah",
"At-Takatsur",
"Al-'Asr",
"Al-Humazah",
"Al-Fil",
"Quraisy",
"Al-Ma'un",
"Al-Kautsar",
"Al-Kafirun",
"An-Nasr",
"Al-Lahab",
"Al-Ikhlas",
"Al-Falaq",
"An-Nas"

],

aqidah:[

"Kisah Nabi Muhammad SAW",

"Sifat Wajib bagi Allah beserta artinya",

"Nadhom Silsilah Nabi",

"Sifat Wajib bagi Allah",

"Nama-nama Malaikat dan tugasnya",

"Nama-nama Anak Nabi",

"Nama-nama Nabi & Rasul",

"Sifat Mustahil bagi Allah beserta artinya",

"Sifat Wajib dan Mustahil bagi Rasul beserta artinya"

],

dzikiran:[

"Dzikiran Ba'da Sholat"

],

almasurat:[

"Al-Ma'surat"

],

awamil:[

"Awamil"

],

amsilati:[

"Amsilati"

]

};


const namaMateri={

juz30:"📖 JUZ 30",

aqidah:"🕌 AQIDAH",

dzikiran:"🤲 DZIKIRAN BA'DA SHOLAT",

almasurat:"📿 AL-MA'SURAT",

awamil:"📚 AWAMIL",

amsilati:"📕 AMSILATI"

};



let siswaData=[];

let siswaAktif=null;

let kategoriAktif=null;



/* LOAD */

async function loadStudents(){

try{

const snapshot=
await getDocs(
siswaCollection
);

siswaData=[];

snapshot.forEach(item=>{

siswaData.push({

id:item.id,

...item.data()

});

});

renderStudents();

renderStatistics();

}catch(error){

console.error(error);

showToast(
"❌ Gagal mengambil data"
);

}

}



/* HOME */

window.showHome=function(){

hidePages();

document
.getElementById("homePage")
.classList.add("active");

renderStudents();

};



window.showStatistics=function(){

hidePages();

document
.getElementById("statisticsPage")
.classList.add("active");

renderStatistics();

};



function showStudent(){

hidePages();

document
.getElementById("studentPage")
.classList.add("active");

};



window.showStudent=showStudent;



function hidePages(){

document
.querySelectorAll(".page")
.forEach(page=>{

page.classList.remove("active");

});

}



/* SISWA */

window.renderStudents=function(){

const container=
document.getElementById(
"studentList"
);

const keyword=
document
.getElementById("searchInput")
.value
.toLowerCase();


const hasil=
siswaData.filter(siswa=>
(siswa.nama||"")
.toLowerCase()
.includes(keyword)
);


container.innerHTML="";


if(hasil.length===0){

container.innerHTML=`

<div class="card empty">

👤<br><br>

Belum ada siswa.

</div>

`;

return;

}


hasil.forEach(siswa=>{

const progress=
getProgress(siswa);


container.innerHTML+=`

<div class="student">

<div class="student-name">

👤 ${escapeHTML(siswa.nama)}

</div>

<div class="student-class">

Kelas ${escapeHTML(siswa.kelas)}

</div>


<div class="progress">

<div
class="progress-bar"
style="width:${progress.percent}%">

</div>

</div>


<div class="progress-text">

${progress.hafal}/${progress.total}
materi • ${progress.percent}%

</div>


<div class="student-actions">

<button
class="btn btn-primary"
onclick="openStudent('${siswa.id}')">

📚 Buka

</button>


<button
class="btn btn-warning"
onclick="editStudent('${siswa.id}')">

✏️

</button>


<button
class="btn btn-danger"
onclick="deleteStudent('${siswa.id}')">

🗑️

</button>

</div>

</div>

`;

});

};



function getProgress(siswa){

let total=0;

let hafal=0;


Object.keys(materi).forEach(kategori=>{

total+=materi[kategori].length;

const data=
siswa.hafalan?.[kategori]||{};


materi[kategori]
.forEach((_,index)=>{

if(data[index]===true){

hafal++;

}

});

});


return{

total,

hafal,

percent:
total
? Math.round(
(hafal/total)*100
)
:0

};

}



/* ADD */

window.openAddStudent=function(){

document
.getElementById("studentNameInput")
.value="";

document
.getElementById("studentClassInput")
.value="";


document
.getElementById("studentModal")
.classList.add("show");

};



window.closeAddStudent=function(){

document
.getElementById("studentModal")
.classList.remove("show");

};



window.saveStudent=async function(){

const nama=
document
.getElementById("studentNameInput")
.value.trim();


const kelas=
document
.getElementById("studentClassInput")
.value.trim();


if(!nama||!kelas){

alert(
"Nama dan kelas wajib diisi!"
);

return;

}


try{

await addDoc(

siswaCollection,

{

nama,

kelas,

hafalan:{},

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}

);


closeAddStudent();

await loadStudents();

showToast(
"✅ Siswa ditambahkan"
);


}catch(error){

console.error(error);

showToast(
"❌ Gagal menambahkan"
);

}

};



/* OPEN STUDENT */

window.openStudent=function(id){

siswaAktif=
siswaData.find(
s=>s.id===id
);


if(!siswaAktif)return;


document
.getElementById("detailName")
.textContent=
"👤 "+siswaAktif.nama;


document
.getElementById("detailClass")
.textContent=
"Kelas "+siswaAktif.kelas;


updateDetail();

hidePages();

document
.getElementById("studentPage")
.classList.add("active");

};



function updateDetail(){

const progress=
getProgress(siswaAktif);


document
.getElementById("detailProgressBar")
.style.width=
progress.percent+"%";


document
.getElementById("detailProgressText")
.textContent=
`${progress.hafal}/${progress.total} materi • ${progress.percent}%`;

}



/* CATEGORY */

window.openCategory=function(kategori){

kategoriAktif=kategori;


document
.getElementById("materialTitle")
.textContent=
namaMateri[kategori];


document
.getElementById("materialSubtitle")
.textContent=
"Hafalan "+siswaAktif.nama;


renderMaterials();


hidePages();

document
.getElementById("materialPage")
.classList.add("active");

};



function renderMaterials(){

const list=
document
.getElementById("materialList");


list.innerHTML="";


const daftar=
materi[kategoriAktif];


const data=
siswaAktif
.hafalan?.[kategoriAktif]||{};


let hafal=0;


daftar.forEach(
(nama,index)=>{

const checked=
data[index]===true;


if(checked)hafal++;


const item=
document.createElement(
"label"
);


item.className=
"material-item"+
(
checked
?" done"
:""
);


item.innerHTML=`

<input
type="checkbox"
${checked?"checked":""}
>

<div class="material-name">

${escapeHTML(nama)}

</div>

<div class="material-status">

${
checked
?"✓ Sudah Hafal"
:"Belum Hafal"
}

</div>

`;


item
.querySelector("input")
.addEventListener(
"change",
e=>{

saveChecklist(
index,
e.target.checked
);

});


list.appendChild(item);

});


const percent=
daftar.length
?Math.round(
(hafal/daftar.length)*100
)
:0;


document
.getElementById(
"materialProgressBar"
)
.style.width=
percent+"%";


document
.getElementById(
"materialProgressText"
)
.textContent=
`${hafal}/${daftar.length} hafal • ${percent}%`;

}



/* CHECKLIST */

async function saveChecklist(
index,
value
){

try{

const siswaRef=
doc(
db,
"siswa",
siswaAktif.id
);


const hafalan=
siswaAktif.hafalan||{};


if(!hafalan[kategoriAktif]){

hafalan[kategoriAktif]={};

}


hafalan[kategoriAktif][index]=
value;


await updateDoc(

siswaRef,

{

hafalan,

updatedAt:
serverTimestamp()

}

);


siswaAktif.hafalan=
hafalan;


const indexSiswa=
siswaData.findIndex(
s=>s.id===siswaAktif.id
);


if(indexSiswa!==-1){

siswaData[indexSiswa]=
siswaAktif;

}


renderMaterials();

updateDetail();

renderStatistics();

showToast(
value
?"✅ Setoran disimpan"
:"↩️ Setoran dibatalkan"
);


}catch(error){

console.error(error);

showToast(
"❌ Gagal menyimpan"
);

}

}



/* =====================================================
   STATISTIK / RANKING
===================================================== */

window.renderStatistics=function(){

const kategori=
document
.getElementById("statCategory")
.value;


const ranking=[];


siswaData.forEach(siswa=>{

const data=
siswa.hafalan?.[kategori]||{};


let jumlah=0;


materi[kategori]
.forEach((_,index)=>{

if(data[index]===true){

jumlah++;

}

});


ranking.push({

nama:siswa.nama,

jumlah

});

});


/* SORT TERBANYAK */

ranking.sort(
(a,b)=>b.jumlah-a.jumlah
);


const totalSetoran=
ranking.reduce(
(total,item)=>
total+item.jumlah,
0
);


const terbanyak=
ranking.length
?ranking[0]
:null;


document
.getElementById("statTotalSiswa")
.textContent=
ranking.length;


document
.getElementById("statTotalSetoran")
.textContent=
totalSetoran;


document
.getElementById("statTerbanyak")
.textContent=
terbanyak
?terbanyak.jumlah
:0;


const container=
document
.getElementById("rankingList");


container.innerHTML="";


if(ranking.length===0){

container.innerHTML=`

<div class="empty">

Belum ada data siswa.

</div>

`;

return;

}


const max=
Math.max(
...ranking.map(
item=>item.jumlah
),
1
);


ranking.forEach(
(item,index)=>{

const percent=
Math.round(
(item.jumlah/max)*100
);


let emoji="";


if(index===0)emoji="🥇";

else if(index===1)emoji="🥈";

else if(index===2)emoji="🥉";

else emoji="";


container.innerHTML+=`

<div class="rank-item">

<div class="rank-top">

<div class="rank-name">

${emoji}
${index+1}. 
${escapeHTML(item.nama)}

</div>

<div class="rank-value">

${item.jumlah}
/
${materi[kategori].length}

</div>

</div>


<div class="rank-bar">

<div
class="rank-fill"
style="width:${percent}%">

</div>

</div>


<div class="progress-text">

${item.jumlah}
materi sudah hafal

</div>

</div>

`;

});

};

/* TOAST */

function showToast(message){

const toast=
document.getElementById("toast");


toast.textContent=
message;


toast.classList.add("show");


setTimeout(()=>{

toast.classList.remove("show");

},2500);

}



/* SECURITY */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}
